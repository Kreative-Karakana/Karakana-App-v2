name: iOS Release Build

on:
  workflow_dispatch:

# No cancel-in-progress: this job signs and uploads a build to App Store
# Connect. Killing it mid-run can leave a partially-uploaded binary or
# invalidate the signing session; a duplicate manual trigger is rare enough
# that letting it queue is the safer trade-off.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  validate-release-ref:
    name: Validate release source ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require an approved release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] || \
             [[ "$GITHUB_REF" == refs/heads/release/* ]] || \
             [[ "$GITHUB_REF" =~ ^refs/tags/(v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|release/.+)$ ]]; then
            echo "Approved iOS release ref: $GITHUB_REF"
            exit 0
          fi

          echo "::error::iOS releases may only run from main, release/* branches, or release tags. Received: $GITHUB_REF"
          exit 1

  build-ios:
    needs: validate-release-ref
    runs-on: macos-15
    environment: production
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Print Flutter version
        run: flutter --version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Resolve release version from pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' pubspec.yaml)"
          if [[ ! "$APP_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)[+]([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version must include a release name and numeric build number (for example, 2.3.0+40)."
            exit 1
          fi

          VERSION_NAME="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[3]}"
          printf 'VERSION_NAME=%s\nBUILD_NUMBER=%s\n' "$VERSION_NAME" "$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building authorized version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Set iOS build number
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION_NAME" ios/Runner/Info.plist
          echo "iOS build number set to: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Verify Pods signing overrides
        run: |
          PBXPROJ="ios/Pods/Pods.xcodeproj/project.pbxproj"
          test -f "$PBXPROJ"
          grep -q "CODE_SIGNING_ALLOWED = NO;" "$PBXPROJ"
          grep -q "CODE_SIGNING_REQUIRED = NO;" "$PBXPROJ"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = "";' "$PBXPROJ"
          echo "✅ Pods signing overrides verified in $PBXPROJ"

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive with xcodebuild
        env:
          PROVISIONING_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
            xcodebuild \
              -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/Runner.xcarchive \
              -destination generic/platform=iOS \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="${PROVISIONING_PROFILE_UUID}" \
              DEVELOPMENT_TEAM=J3M8G9NBLH \
              FLUTTER_BUILD_NAME="$VERSION_NAME" \
              FLUTTER_BUILD_NUMBER="$BUILD_NUMBER" \
              TREE_SHAKE_ICONS=false \
              COMPILER_INDEX_STORE_ENABLE=NO \
              archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Confirm IPA exists
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA not found — build failed"
            exit 1
          else
            echo "✅ IPA built successfully: $IPA_PATH"
            ls -lh "$IPA_PATH"
          fi

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_APP_PASSWORD }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APP_STORE_CONNECT_USERNAME" \
            --password "$APP_STORE_CONNECT_PASSWORD"

      - name: Summary
        run: |
          echo "### ✅ iOS Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded to App Store Connect ✅" >> $GITHUB_STEP_SUMMARY

      - name: Clean iOS signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12"
          rm -f "$RUNNER_TEMP/profile.mobileprovision"
