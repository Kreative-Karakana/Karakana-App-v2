name: iOS Release Build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Print Flutter version
        run: flutter --version

      - name: Bump version in pubspec.yaml
        run: |
          VERSION_NAME="${{ github.event.inputs.version_name }}"
          BUILD_NUMBER="${{ github.run_number }}"
          sed -i '' "s/^version: .*/version: ${VERSION_NAME}+${BUILD_NUMBER}/" pubspec.yaml
          echo "Building version: ${VERSION_NAME}+${BUILD_NUMBER}"
          cat pubspec.yaml | grep "^version:"

      - name: Set iOS build number
        run: |
          BUILD_NUMBER="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ github.event.inputs.version_name }}" ios/Runner/Info.plist
          echo "iOS build number set to: $BUILD_NUMBER"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" ios/Runner/Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: cd ios && pod install && cd ..

      - name: Verify Pods signing overrides
        run: |
          PBXPROJ="ios/Pods/Pods.xcodeproj/project.pbxproj"
          test -f "$PBXPROJ"
          grep -q "CODE_SIGNING_ALLOWED = NO;" "$PBXPROJ"
          grep -q "CODE_SIGNING_REQUIRED = NO;" "$PBXPROJ"
          grep -q 'PROVISIONING_PROFILE_SPECIFIER = "";' "$PBXPROJ"
          echo "✅ Pods signing overrides verified in $PBXPROJ"

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PP_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build Flutter iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --no-tree-shake-icons \
            --build-number=${{ github.run_number }} \
            --build-name=${{ github.event.inputs.version_name }}
        env:
          FLUTTER_SUPPRESS_ANALYTICS: true

      - name: Archive with xcodebuild
        env:
          PROVISIONING_PROFILE_UUID: ${{ secrets.IOS_PROVISIONING_PROFILE_UUID }}
        run: |
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -archivePath build/Runner.xcarchive \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_UUID" \
              DEVELOPMENT_TEAM=J3M8G9NBLH \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGNING_ALLOWED=YES \
              -destination generic/platform=iOS \
              archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa

      - name: Confirm IPA exists
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ IPA not found — build failed"
            exit 1
          else
            echo "✅ IPA built successfully: $IPA_PATH"
            ls -lh "$IPA_PATH"
          fi

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_USERNAME: ${{ secrets.APP_STORE_CONNECT_USERNAME }}
          APP_STORE_CONNECT_PASSWORD: ${{ secrets.APP_STORE_CONNECT_APP_PASSWORD }}
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "Uploading: $IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APP_STORE_CONNECT_USERNAME" \
            --password "$APP_STORE_CONNECT_PASSWORD"

      - name: Summary
        run: |
          echo "### ✅ iOS Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Uploaded to App Store Connect ✅" >> $GITHUB_STEP_SUMMARY
