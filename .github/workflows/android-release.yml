name: Android Release Build

on:
  workflow_dispatch:

# No cancel-in-progress: this job signs a release keystore-backed build.
# Letting a duplicate manual trigger queue behind it is cheaper than risking
# a killed run leaving signing artifacts half-written.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"
  FLUTTER_SUPPRESS_ANALYTICS: "true"

jobs:
  validate-release-ref:
    name: Validate release source ref
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Require an approved release ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/main" ]] || \
             [[ "$GITHUB_REF" == refs/heads/release/* ]] || \
             [[ "$GITHUB_REF" =~ ^refs/tags/(v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?|release/.+)$ ]]; then
            echo "Approved Android release ref: $GITHUB_REF"
            exit 0
          fi

          echo "::error::Android releases may only run from main, release/* branches, or release tags. Received: $GITHUB_REF"
          exit 1

  build-android-release:
    name: Build Android release artifacts
    needs: validate-release-ref
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify Flutter version
        run: flutter --version

      - name: Resolve release version from pubspec.yaml
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*$/\1/p' pubspec.yaml)"
          if [[ ! "$APP_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?)[+]([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version must include a release name and numeric build number (for example, 2.3.0+40)."
            exit 1
          fi

          VERSION_NAME="${BASH_REMATCH[1]}"
          BUILD_NUMBER="${BASH_REMATCH[3]}"
          printf 'VERSION_NAME=%s\nBUILD_NUMBER=%s\n' "$VERSION_NAME" "$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Building authorized version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/release.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=app/keystore/release.jks"
          } > android/key.properties
          chmod 600 android/key.properties android/app/keystore/release.jks

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Build release app bundle
        run: |
          flutter build appbundle --release \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Confirm Android artifacts exist
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error

      - name: Clean Android signing files
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/keystore/release.jks
