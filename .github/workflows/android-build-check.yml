name: Android Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests if present
        run: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Dart tests found."
          fi

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Summary
        run: |
          echo "### ✅ Android Build Check Complete" >> $GITHUB_STEP_SUMMARY
          echo "- flutter pub get ✅" >> $GITHUB_STEP_SUMMARY
          echo "- flutter analyze ✅" >> $GITHUB_STEP_SUMMARY
          echo "- flutter test ✅ if tests were present" >> $GITHUB_STEP_SUMMARY
          echo "- flutter build apk --debug ✅" >> $GITHUB_STEP_SUMMARY
