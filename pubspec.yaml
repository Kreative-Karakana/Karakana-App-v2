name: karakana_app
description: Karakana - Tanzanian Edutech Platform for Entrepreneurship Training
publish_to: none
version: 2.0.2+34

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.2.0

  # HTTP & API
  dio: ^5.4.0

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI & Images
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  local_auth: ^2.1.8

  # Media
  video_player: ^2.8.2
  in_app_purchase: ^3.2.0

  # Utils
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7
  file_selector: ^1.0.3
  url_launcher: ^6.2.4
  share_plus: ^7.2.2
  connectivity_plus: ^5.0.2
  flutter_screenutil: ^5.9.0

  # PDF
  pdf: ^3.10.8
  printing: ^5.12.0

  # Notifications
  firebase_core: ^3.0.0
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/.env
    - assets/images/
    - assets/onboarding/
    - assets/icons/
    - mno_logos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_launcher_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#3D1800"
  adaptive_icon_foreground: "assets/images/app_launcher_icon.png"
